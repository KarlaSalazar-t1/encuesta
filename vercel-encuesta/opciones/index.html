<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Pantalla final de envíos · propuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --red:#DB3B2B; --red-hover:#CC0000; --red-50:#FEF4F4;
  --ink:#1F2937; --oxford:#4C4C4C; --g500:#737373; --g400:#A3A3A3;
  --g200:#E5E5E5; --g100:#F2F2F2; --g50:#F8F8F8; --line:#E7E7E7;
  --blue:#2180FF; --green:#51AF70;
}
*{box-sizing:border-box}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.366;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1600px;margin:0 auto;padding:44px 40px 80px}
.cab{max-width:620px}
.cab h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0}
.cab p{font-size:15px;color:var(--g500);margin:12px 0 0;line-height:1.6}

.vp{display:inline-flex;gap:3px;background:var(--g50);border:1px solid var(--line);
  border-radius:10px;padding:3px;margin-top:26px}
.vp button{font:600 12.5px 'Manrope',sans-serif;color:var(--g500);background:transparent;
  border:0;border-radius:7px;padding:7px 14px;cursor:pointer;
  transition:color .15s ease, background-color .15s ease}
.vp button:hover{color:var(--ink)}
.vp button[aria-pressed="true"]{background:#fff;color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.vp button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.p{margin-top:56px;border-top:1px solid var(--line);padding-top:30px}
.p-cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.p-n{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--red)}
.p-cab h2{font-size:21px;font-weight:700;letter-spacing:-.028em;margin:0}
.p-cab em{font-style:normal;font-size:13.5px;color:var(--g500)}
.p-notas{display:flex;gap:40px;margin:16px 0 24px;flex-wrap:wrap;max-width:860px}
.p-notas div{flex:1;min-width:250px}
.p-notas dt{font-size:12px;font-weight:800;margin:0 0 5px}
.p-notas .pro dt{color:var(--green)}
.p-notas .con dt{color:var(--g400)}
.p-notas dd{font-size:14px;color:var(--oxford);margin:0;line-height:1.55}
.marcos{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.marco-t{font-size:12px;font-weight:700;color:var(--g500);margin:0 0 8px}
.marco{border:1px solid var(--line);border-radius:12px;overflow:hidden;
  width:900px;max-width:100%;background:var(--g50)}
.marco.movil{width:390px}
.marco iframe{display:block;width:100%;height:640px;border:0}
.marco.movil iframe{height:700px}

@media (max-width:768px){
  .wrap{padding:28px 20px 60px}
  .cab h1{font-size:24px}
  .p-notas{gap:18px}
}
</style>

<div class="wrap">
  <div class="cab">
    <h1>Pantalla final de envíos</h1>
    <p>Cuatro enfoques para el mismo momento: la encuesta terminó y hay que
    empujar la primera recarga. Cambia la estructura y el mensaje, no solo
    el color.</p>
    <div class="vp" role="group" aria-label="Tamaño de pantalla">
      <button type="button" data-vp="d" aria-pressed="true">Escritorio</button>
      <button type="button" data-vp="m" aria-pressed="false">Móvil</button>
    </div>
  </div>
  <div id="lista"></div>
</div>

<script>
var GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>' +
  '<path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';
var RELOJ = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/></svg>';
var FLECHA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var CHECK = '<div class="dico"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" aria-hidden="true">' +
  '<path d="M7.5 15.4L12.6 20.5L22.5 9.9" stroke="#fff" stroke-width="3" stroke-linecap="round" ' +
  'stroke-linejoin="round"/></svg></div>';
var EQUIS = '<button type="button" class="cerrar" aria-label="Cerrar">' +
  '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">' +
  '<path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round"/></svg></button>';

/* El modal es el mismo de la encuesta: mismos tokens, mismas medidas. */
var CSS = `
:root{--red:#DB3B2B;--red-hover:#CC0000;--red-50:#FEF4F4;--ink:#1F2937;--oxford:#4C4C4C;
--g500:#737373;--g400:#A3A3A3;--g200:#E5E5E5;--g100:#F2F2F2;--g50:#F8F8F8;--line:#E7E7E7;
--blue:#2180FF;--green:#51AF70}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);line-height:1.366;-webkit-font-smoothing:antialiased;
font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
/* El velo real: 60% de negro sobre el admin claro */
.veil{position:fixed;left:0;right:0;top:0;height:100%;background:#636363;
display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:24px}
.modal{background:#fff;border-radius:16px;box-shadow:0 0 5px 1px rgba(0,0,0,.1);
display:flex;flex-direction:column;overflow:hidden;position:relative;
width:860px;height:580px;max-width:100%;max-height:100%}
.cerrar{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;
border-radius:50%;border:0;background:var(--g100);color:var(--g500);cursor:pointer;
display:grid;place-items:center;transition:background-color .15s ease,color .15s ease}
.cerrar:hover{background:var(--g200);color:var(--ink)}
.cerrar:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* El cuerpo se centra en lo que sobra; las acciones viven abajo, fijas */
.finL{flex:1;display:flex;flex-direction:column;padding:34px;min-height:0;overflow:auto}
.cuerpo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;width:100%;min-height:0}
.acciones{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
width:100%;text-align:center;padding-top:20px}

.dico{width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;
place-items:center;margin-bottom:12px;flex:0 0 auto}
h3{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 3px;color:var(--ink)}
.sub{font-size:14px;color:var(--g500);margin:0;max-width:38ch;line-height:1.5}
.linkSalida{background:none;border:0;color:var(--g500);font:500 13.5px 'Manrope',sans-serif;
cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px;border-radius:6px;
margin-top:14px}
.linkSalida:hover{color:var(--ink)}
.linkSalida:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.of-cta{width:100%;max-width:420px;background:var(--red);color:#fff;height:44px;border:0;
border-radius:10px;font:700 14px 'Manrope',sans-serif;cursor:pointer;flex:0 0 auto;
transition:background-color .15s ease}
.of-cta:hover{background:var(--red-hover)}
.of-cta:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.of-pie{font-size:11.5px;font-weight:600;color:var(--oxford);margin:12px 0 0;display:flex;
align-items:center;justify-content:center;gap:6px}
.of-pie + .linkSalida{margin-top:8px}

/* ── 2 · Regalo ── */
.regalo{width:100%;max-width:420px;margin:24px 0 0;border-radius:14px;padding:20px 22px;
background:linear-gradient(152deg,#E4472F 0%,#DB3B2B 50%,#BE2B1C 100%);color:#fff;
box-shadow:0 10px 28px -12px rgba(190,43,28,.6);display:flex;align-items:center;
text-align:left;overflow:hidden;flex:0 0 auto}
.rg-ico{flex:0 0 40px;display:grid;place-items:center}
.rg-ico svg{width:25px;height:25px}
.rg-cut{position:relative;width:0;align-self:stretch;flex:0 0 auto;
border-left:1px dashed rgba(255,255,255,.5);margin:-20px 18px -20px 4px}
.rg-cut::before,.rg-cut::after{content:"";position:absolute;left:-11px;width:22px;height:22px;
border-radius:50%;background:#fff}
.rg-cut::before{top:-11px}
.rg-cut::after{bottom:-11px}
.rg-body{flex:1;min-width:0}
.rg-h{margin:0;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:9px}
.rg-n{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1}
.rg-s{margin:5px 0 0;font-size:12.5px;color:rgba(255,255,255,.85)}
/* Otros rojos de la escala Nexus, planos */
.regalo.r700{background:#CC0000;box-shadow:0 10px 28px -12px rgba(153,0,0,.55)}
.regalo.r400{background:#E26153;box-shadow:0 10px 28px -12px rgba(190,80,64,.55)}

/* ── 1 · Limpia ── */
.tipo{margin:24px 0 0;flex:0 0 auto;max-width:420px}
.tp-s{font-size:15px;font-weight:500;color:var(--oxford);margin:0;line-height:1.5}
.tp-h{display:flex;align-items:baseline;justify-content:center;gap:8px;
flex-wrap:wrap;margin:8px 0 0}
.tp-n{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.04em;
line-height:1}
.tp-l{font-size:15px;font-weight:700;color:var(--ink)}

/* ── 3 · Ahorro ── */
.ah{width:100%;max-width:420px;margin:24px 0 0;background:var(--red-50);border-radius:12px;
padding:18px 22px;display:flex;align-items:center;justify-content:center;gap:24px;flex:0 0 auto}
.ah-c{display:flex;flex-direction:column;gap:4px;text-align:left}
.ah-l{font-size:12px;font-weight:600;color:var(--oxford)}
.ah-v{font-size:27px;font-weight:800;letter-spacing:-.04em;color:var(--ink);line-height:1}
.ah-v.mas{color:var(--red)}
.ah-fl{display:grid;place-items:center;flex:0 0 auto}

/* ── 4 · Calculadora ── */
.calc{width:100%;max-width:420px;margin:22px 0 0;flex:0 0 auto}
.cl-q{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 10px}
.cl-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cl-chips button{height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;
font:700 14px 'Manrope',sans-serif;color:var(--ink);cursor:pointer;
transition:border-color .15s ease,background-color .15s ease}
.cl-chips button:hover{border-color:var(--g200);background:var(--g50)}
.cl-chips button[aria-pressed="true"]{border-color:var(--red);background:var(--red-50)}
.cl-chips button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cl-out{margin-top:12px;background:var(--red-50);border-radius:12px;padding:16px 18px;
display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.cl-lab{font-size:13px;color:var(--oxford);display:block}
.cl-plus{font-size:13px;font-weight:700;color:var(--red);display:block;margin-top:2px}
.cl-n{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--ink);
flex:0 0 auto;line-height:1}

@media (max-width:768px){
  .veil{align-items:end;padding:0}
  .modal{width:100%;height:580px;max-height:100%;border-radius:16px 16px 0 0}
  .finL{padding:26px 22px 22px}
  h3{font-size:21px}
  .rg-n{font-size:32px}
  .rg-h{font-size:15px}
  .tipo{margin-top:20px}
  .tp-n{font-size:23px}
  .tp-l{font-size:14px}
  .tp-s{font-size:14px}
  .ah{gap:16px;padding:16px}
  .ah-v{font-size:23px}
  .cl-out{padding:14px}
  .cl-n{font-size:26px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
`;

var PROPUESTAS = [
  {
    titulo: "Limpia",
    enfoque: "el beneficio en una línea",
    pro: "El título solo confirma y la oferta vive en su propio bloque, en texto plano: " +
         "el único color de la pantalla es el botón. Es la que menos levanta la voz.",
    con: "Sin objeto ni envoltura, el cashback puede pasar como un dato de la pantalla " +
         "y no como un motivo para actuar.",
    cuerpo:
      '<h3>Tu cuenta está lista</h3>' +
      '<div class="tipo">' +
        '<p class="tp-s">Cotiza y ahorra en tu primer envío.</p>' +
        '<p class="tp-h"><span class="tp-n">10%</span>' +
        '<span class="tp-l">de cashback en tu primera recarga</span></p>' +
      '</div>',
    acciones: '<button type="button" class="of-cta">Cotizar</button>'
  },
  {
    titulo: "Regalo",
    enfoque: "el beneficio como recordatorio",
    pro: "La tarjeta no pide acción: deja el beneficio en la cabeza para cuando el " +
         "usuario cotice. El troquel y el rojo avisan que hay un regalo antes de " +
         "leer una palabra.",
    con: "La tarjeta y el botón son la misma masa de color y se pelean el ojo. " +
         "Separarlos obliga a bajar de tono, y ahí la escala de Nexus aprieta: " +
         "el Rojo 400 deja el texto chico en 3.46:1, por debajo de AA.",
    cuerpo: [
      { etiqueta: "Rojo 500 · degradado (el de hoy)", html:
        '<h3>¡Tu primera recarga tiene regalo!</h3>' +
        '<p class="sub">Cotiza y ahorra en tu primer envío.</p>' +
        '<div class="regalo">' + '<span class="rg-ico">' + GIFT + '</span>' +
        '<span class="rg-cut"></span>' +
        '<div class="rg-body">' +
          '<p class="rg-h"><span class="rg-n">10%</span> de cashback</p>' +
          '<p class="rg-s">En tu primera recarga · hasta $5,000 MXN</p>' +
        '</div>' + '</div>' },
      { etiqueta: "Rojo 700 · #CC0000", html:
        '<h3>¡Tu primera recarga tiene regalo!</h3>' +
        '<p class="sub">Cotiza y ahorra en tu primer envío.</p>' +
        '<div class="regalo r700">' + '<span class="rg-ico">' + GIFT + '</span>' +
        '<span class="rg-cut"></span>' +
        '<div class="rg-body">' +
          '<p class="rg-h"><span class="rg-n">10%</span> de cashback</p>' +
          '<p class="rg-s">En tu primera recarga · hasta $5,000 MXN</p>' +
        '</div>' + '</div>' },
      { etiqueta: "Rojo 400 · #E26153", html:
        '<h3>¡Tu primera recarga tiene regalo!</h3>' +
        '<p class="sub">Cotiza y ahorra en tu primer envío.</p>' +
        '<div class="regalo r400">' + '<span class="rg-ico">' + GIFT + '</span>' +
        '<span class="rg-cut"></span>' +
        '<div class="rg-body">' +
          '<p class="rg-h"><span class="rg-n">10%</span> de cashback</p>' +
          '<p class="rg-s">En tu primera recarga · hasta $5,000 MXN</p>' +
        '</div>' + '</div>' }
    ],
    acciones: '<button type="button" class="of-cta">Cotizar</button>'
  },
  {
    titulo: "Ahorro",
    enfoque: "el cashback dicho en pesos",
    pro: "Habla en la moneda del usuario: no un porcentaje que hay que calcular, sino " +
         "cuánto recibe. Se entiende de un vistazo.",
    con: "El ejemplo fija un monto. Con $500 queda muy por encima de la recarga " +
         "promedio de $150, donde la misma cuenta daría $150 → $165.",
    cuerpo:
      '<h3>¡Todo listo!</h3>' +
      '<p class="sub">Cotiza ahora y aprovecha el 10% de cashback en tu primera ' +
      'recarga.</p>' +
      '<div class="ah">' +
        '<span class="ah-c"><span class="ah-l">Recargas</span>' +
        '<span class="ah-v">$500</span></span>' +
        '<span class="ah-fl">' + FLECHA + '</span>' +
        '<span class="ah-c"><span class="ah-l">Recibes</span>' +
        '<span class="ah-v mas">$550</span></span>' +
      '</div>',
    acciones: '<button type="button" class="of-cta">Cotizar</button>'
  },
  {
    titulo: "Calculadora",
    enfoque: "el monto se elige aquí",
    pro: "El beneficio en pesos se entiende más rápido que un porcentaje, y el monto " +
         "llega ya elegido al flujo de recarga.",
    con: "Pide una decisión antes del botón y es la que menos se siente premio.",
    cuerpo:
      '<h3>¡Todo listo!</h3>' +
      '<p class="sub">Tu primera recarga tiene 10% de cashback.</p>' +
      '<div class="calc">' +
        '<p class="cl-q">Recarga ahora y recibe un regalo</p>' +
        '<div class="cl-chips" id="chips">' +
          '<button type="button" data-m="500" aria-pressed="false">$500</button>' +
          '<button type="button" data-m="1000" aria-pressed="true">$1,000</button>' +
          '<button type="button" data-m="2000" aria-pressed="false">$2,000</button>' +
        '</div>' +
        '<div class="cl-out">' +
          '<span><span class="cl-lab">Recibes en saldo</span>' +
          '<span class="cl-plus" id="plus">+$100 de cashback</span></span>' +
          '<span class="cl-n" id="total">$1,100</span>' +
        '</div>' +
      '</div>',
    acciones:
      '<button type="button" class="of-cta" id="cta">Recargar $1,000</button>' +
      '<p class="of-pie">' + RELOJ + 'Solo por tiempo limitado</p>',
    js:
      'var chips=document.getElementById("chips");' +
      'chips.addEventListener("click",function(e){' +
        'var b=e.target.closest("button[data-m]"); if(!b) return;' +
        'Array.prototype.forEach.call(chips.children,function(x){' +
          'x.setAttribute("aria-pressed", x===b?"true":"false")});' +
        'var m=+b.dataset.m, c=Math.round(m*0.10);' +
        'var f=function(n){return "$"+n.toLocaleString("es-MX")};' +
        'document.getElementById("total").textContent=f(m+c);' +
        'document.getElementById("plus").textContent="+"+f(c)+" de cashback";' +
        'document.getElementById("cta").textContent="Recargar "+f(m);' +
      '});'
  }
];

var lista = document.getElementById("lista");

PROPUESTAS.forEach(function(p, i){
  var sec = document.createElement("section");
  sec.className = "p";
  var variantes = Array.isArray(p.cuerpo) ? p.cuerpo : [{etiqueta:"", html:p.cuerpo}];
  var marcos = variantes.map(function(v){
    return '<div>' + (v.etiqueta ? '<p class="marco-t">' + v.etiqueta + '</p>' : '') +
      '<div class="marco"><iframe title="' + p.titulo +
      (v.etiqueta ? ' · ' + v.etiqueta : '') + '"></iframe></div></div>';
  }).join("");
  sec.innerHTML =
    '<div class="p-cab"><span class="p-n">' + (i + 1) + '</span>' +
    '<h2>' + p.titulo + '</h2><em>' + p.enfoque + '</em></div>' +
    '<dl class="p-notas">' +
      '<div class="pro"><dt>Pro</dt><dd>' + p.pro + '</dd></div>' +
      '<div class="con"><dt>Contra</dt><dd>' + p.con + '</dd></div>' +
    '</dl>' +
    '<div class="marcos">' + marcos + '</div>';

  variantes.forEach(function(v, k){
    sec.querySelectorAll("iframe")[k].srcdoc = documento(v.html, p);
  });
  lista.appendChild(sec);
});

function documento(cuerpo, p){
  return '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' +
    'family=Manrope:wght@400;500;600;700;800&display=swap">' +
    '<style>' + CSS + '</style></head><body>' +
    '<div class="veil"><div class="modal" role="dialog" aria-modal="true">' +
    EQUIS +
    '<div class="finL">' +
      '<div class="cuerpo">' + CHECK + cuerpo + '</div>' +
      '<div class="acciones">' + p.acciones +
      '<button type="button" class="linkSalida">Ir al admin</button></div>' +
    '</div></div></div>' +
    (p.js ? '<script>' + p.js + '<\/script>' : '') +
    '</body></html>';
}

/* Móvil de verdad: el iframe se angosta y las media queries sí disparan */
var vp = document.querySelector(".vp");
vp.addEventListener("click", function(e){
  var b = e.target.closest("button[data-vp]");
  if(!b) return;
  Array.prototype.forEach.call(vp.children, function(x){
    x.setAttribute("aria-pressed", x === b ? "true" : "false");
  });
  var movil = b.dataset.vp === "m";
  Array.prototype.forEach.call(document.querySelectorAll(".marco"), function(m){
    m.classList.toggle("movil", movil);
  });
});
</script>
