<title>Encuesta de alta T1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<style>
:root{
  --red:#DB3B2B; --red-hover:#CC0000; --red-200:#F1B0A9; --red-50:#FEF4F4;
  --ink:#1F2937; --oxford:#4C4C4C; --g500:#737373; --g400:#A3A3A3;
  --g200:#E5E5E5; --g100:#F2F2F2; --g50:#F8F8F8; --line:#E7E7E7;
  --blue:#2180FF; --green:#51AF70;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.366;-webkit-font-smoothing:antialiased;
}
.brand{display:block;width:auto;height:19px;flex:0 0 auto}
.iso{display:block;width:auto;height:32px;flex:0 0 auto;align-self:flex-start}

/* Selector de producto — herramienta de revisión, no parte del producto */
.ab{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;
  display:flex;gap:3px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:10px;padding:3px;
}
.ab button{
  font:600 12.5px 'Manrope',sans-serif;color:var(--g500);background:transparent;
  border:0;border-radius:7px;padding:6px 13px;cursor:pointer;
  transition:color .15s ease, background-color .15s ease;
}
.ab button:hover{color:var(--ink)}
.ab button[aria-pressed="true"]{background:var(--g100);color:var(--ink)}
.ab button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ══════════ Administrador de fondo ══════════ */
.app{min-height:100vh;display:flex;flex-direction:column}
.adm-h{height:48px;flex:0 0 48px;border-bottom:1px solid var(--g200);
  display:flex;align-items:center;gap:14px;padding:0 16px}
.burger{display:flex;flex-direction:column;gap:3px}
.burger i{display:block;width:14px;height:1.5px;background:var(--oxford);border-radius:1px}
.adm-store{display:flex;align-items:center;gap:8px;border:1px solid var(--g200);border-radius:10px;
  height:32px;padding:0 11px;margin-left:16px}
.adm-av{width:20px;height:20px;border-radius:6px;background:var(--red-200);display:grid;
  place-items:center;font-size:9.5px;font-weight:800;color:var(--red)}
.adm-store span{font-size:12.5px;font-weight:600;color:var(--oxford)}
.adm-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.adm-sal{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.adm-sal em{font-style:normal;font-weight:500;color:var(--g500);font-size:10.5px;display:block;line-height:1.2}
.adm-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--oxford)}
.adm-u{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;
  place-items:center;font-size:10.5px;font-weight:800;flex:0 0 auto}
.adm-b{flex:1;display:flex;min-height:0}
.adm-s{width:184px;flex:0 0 184px;border-right:1px solid var(--g200);padding:12px;
  display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.adm-cta{height:36px;border-radius:10px;background:var(--red);color:#fff;font-size:13px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;
  flex:0 0 auto}
.adm-n{height:34px;flex:0 0 34px;border-radius:8px;display:flex;align-items:center;gap:10px;
  padding:0 11px;font-size:13px;color:var(--oxford)}
.adm-n.on{background:var(--g50);color:var(--red);font-weight:700;box-shadow:inset 2px 0 0 var(--red)}
.adm-sub{height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;padding:0 11px;
  margin-left:27px;font-size:12.5px;color:var(--oxford)}
.adm-g{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--g400);padding:14px 11px 5px}
.adm-m{flex:1;padding:24px;overflow:auto;max-width:1600px;width:100%}
.adm-t{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 3px}
.adm-c{font-size:12px;color:var(--g500);margin:0 0 20px}
.adm-k{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--g500);margin:0 0 6px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;font-weight:700;color:var(--green);margin-top:3px}
.adm-2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px}
.card h6{font-size:13px;font-weight:700;margin:0 0 14px}
.bars{display:flex;align-items:flex-end;gap:9px;height:112px}
.bars i{flex:1;background:var(--red-200);border-radius:3px 3px 0 0;display:block}
.bars i:nth-child(7){background:var(--red)}
.li{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.li .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}
.li .tx{font-size:12px;color:var(--oxford);flex:1}
.li .tm{font-size:11px;color:var(--g400);font-variant-numeric:tabular-nums}
.tbl{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;gap:12px;padding:11px 16px;
  font-size:12.5px;color:var(--oxford);border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr.h{background:#F4F8FF;font-weight:700;font-size:11.5px;color:var(--ink)}
.bdg{display:inline-block;background:#F0FDF4;color:#2E7D32;font-size:10.5px;font-weight:700;
  border-radius:4px;padding:2px 7px}
.bdg.w{background:#FFF4BF;color:#8A6100}

@media (max-width:768px){
  .adm-s,.adm-store,.adm-sal,.tbl{display:none}
  .adm-m{padding:16px}
  .adm-k{grid-template-columns:1fr 1fr;gap:10px}
  .adm-2{grid-template-columns:1fr}
  .adm-t{font-size:17px}
}

/* ══════════════════ Velo + modal ══════════════════ */
/* Alto gobernado por el viewport visual: al abrirse el teclado la hoja
   se apoya sobre él y el pie nunca queda tapado. */
.veil{position:fixed;left:0;right:0;top:0;height:100%;background:rgba(0,0,0,.6);z-index:60;
  display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:24px}
.veil.enter{animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.modal{background:#fff;border-radius:16px;box-shadow:0 0 5px 1px rgba(0,0,0,.1);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  max-width:100%;max-height:100%}
.modalA{width:860px;height:580px}
.modalB{width:880px;height:600px;flex-direction:row}
.modal.enter{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}
                to{opacity:1;transform:translateY(0) scale(1)}}

@media (max-width:768px){
  .ab{top:8px;padding:2px}
  .ab button{font-size:12px;padding:5px 11px}
  .veil{align-items:end;padding:0}
  .modal,.modalA,.modalB{width:100%;height:580px;max-height:100%;
    border-radius:16px 16px 0 0;flex-direction:column}
  .modal.enter{animation:riseM .26s ease both}
  .confetti{width:80%;height:110%}
}
@keyframes riseM{from{transform:translateY(100%)}to{transform:translateY(0)}}

.rail{width:170px;height:4px;border-radius:2px;background:var(--g200);overflow:hidden;flex:0 0 auto}
.rail i{display:block;height:100%;background:var(--red);border-radius:2px;
  transform-origin:left center;transition:transform .3s ease}

.head{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:30px 48px 0;flex:0 0 auto}
.pane{flex:1;display:flex;flex-direction:column;padding:28px 48px 40px;min-width:0;
  overflow:hidden;min-height:0}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--g500);margin:0 0 18px}
.eyebrow span{color:var(--g400);margin:0 9px}

/* Alto reservado: el control arranca a la misma altura en todas las pantallas.
   La primera queda más abajo porque lleva el rótulo. */
.qb{min-height:86px}
.q{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:0 0 8px;
  color:var(--ink);text-wrap:balance}
.help{font-size:14px;color:var(--g500);margin:0;line-height:1.5}

.anim{flex:1;min-height:0;overflow:auto;animation:slide .2s ease both}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

.opts{display:grid;gap:16px;grid-template-columns:1fr}
.opts.g3{grid-template-columns:repeat(3,1fr)}
.opts.g2{grid-template-columns:1fr 1fr}
.opts.g2 > :last-child{grid-column:1 / -1}

.opt{
  display:grid;grid-template-columns:20px minmax(0,1fr);align-items:center;column-gap:12px;
  min-height:56px;padding:14px 16px;width:100%;
  border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;
  font-family:'Manrope',sans-serif;
  transition:background-color .15s ease, border-color .15s ease;
}
.opt-t{font-size:14px;font-weight:400;color:var(--oxford);line-height:1.3}
.opts.g3 .opt-t{text-align:center}
.opt:hover{background:var(--g50)}
.opt[aria-checked="true"]{border-color:var(--red);background:var(--red-50)}
.opt[aria-checked="true"]:hover{background:var(--red-50)}
.opt[aria-checked="true"] .opt-t{font-weight:600;color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.mark{width:20px;height:20px;border:1.5px solid #D4D4D4;background:#fff;
  display:grid;place-items:center;transition:border-color .15s ease, background-color .15s ease}
.mark.radio{border-radius:50%}
.mark.check{border-radius:5px}
.mark i{display:block;opacity:0;transition:opacity .12s ease}
.mark.radio i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.opt[aria-checked="true"] .mark{border-color:var(--red)}
.opt[aria-checked="true"] .mark.check{background:var(--red)}
.opt[aria-checked="true"] .mark i{opacity:1}

.field{
  height:48px;width:100%;border:1px solid var(--g200);border-radius:8px;background:#fff;
  padding:0 16px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:var(--ink);
  transition:border-color .15s ease, background-color .15s ease;
}
.field::placeholder{color:var(--g400);font-weight:400}
.field:hover{background:var(--g50)}
.field:focus,.field:focus-visible{outline:none;border-color:var(--g400)}

.foot{flex:0 0 auto;padding-top:24px;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.foot-r{display:flex;align-items:center;gap:14px;margin-left:auto}
.linkOmitir{background:none;border:0;color:var(--g500);font:500 13.5px 'Manrope',sans-serif;
  cursor:pointer;padding:8px 4px;border-radius:6px;white-space:nowrap}
.linkOmitir:hover{color:var(--ink)}
.linkOmitir:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.btn{
  height:44px;border-radius:10px;padding:0 24px;font:600 14px 'Manrope',sans-serif;border:0;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:background-color .15s ease, color .15s ease;
}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btnP{background:var(--red);color:#fff}
.btnP:hover{background:var(--red-hover)}
.btnP[aria-disabled="true"]{background:var(--red-200);cursor:not-allowed}
.btnS{background:#fff;color:var(--oxford);border:1px solid var(--g200)}
.btnS:hover{background:var(--g50)}
.back{background:transparent;border:0;color:var(--oxford);font:500 14px 'Manrope',sans-serif;
  cursor:pointer;padding:8px 4px;display:inline-flex;align-items:center;gap:9px;border-radius:6px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── Opción B (se conserva solo para el archivo de registro) ── */
.bL{width:320px;flex:0 0 320px;background:#fff;border-right:1px solid var(--line);
  padding:40px 36px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bL::before{
  content:"";position:absolute;width:460px;height:460px;left:-150px;bottom:-190px;border-radius:50%;
  background:radial-gradient(circle, rgba(219,59,43,.11) 0%, rgba(219,59,43,.04) 45%, rgba(219,59,43,0) 72%);
  pointer-events:none;
}
.bL > *{position:relative;z-index:1}
.bL .bTitle{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.22;
  color:var(--ink);margin:40px 0 0;text-wrap:balance}
.bL .bSub{font-size:14px;color:var(--g500);margin:10px 0 0;line-height:1.5}
.bL .rail{width:100%;margin:26px 0 0}
.bR{flex:1;display:flex;flex-direction:column;padding:40px;background:#fff;min-width:0;
  overflow:hidden;min-height:0}
.bR .opts{gap:12px}
.bR .opt{min-height:52px}
.bR .qb{min-height:82px}
.bR .q{font-size:24px}
.bTop{margin-bottom:22px}
.bTop.solo{margin-bottom:16px}
.bTop.solo .rail{margin-top:0}
.bTop .bTitle{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0;color:var(--ink)}
.bTop .bSub{font-size:13.5px;color:var(--g500);margin:8px 0 0;line-height:1.5}
.bTop .rail{width:100%;margin-top:18px}
@media (max-width:768px){ .bL{display:none} .bR{padding:22px} }

/* ══════════════════ Cierre ══════════════════ */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:36px 44px;position:relative;z-index:1}
.dico{width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;
  place-items:center;margin-bottom:12px}
/* La palomita salta al llegar al cierre, no en cada repintado */
.celebra .dico{animation:pop .26s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.done h3,.finL h3{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 3px;color:var(--ink)}
.done .sub,.finL .sub{font-size:14px;color:var(--g500);margin:0}

/* ── Cierre: mismo marco que las preguntas, la oferta como tarjeta ── */
.modalFin{width:860px;height:580px}
.cerrar{
  position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;
  border:0;background:var(--g100);color:var(--g500);cursor:pointer;
  display:grid;place-items:center;transition:background-color .15s ease, color .15s ease;
}
.cerrar:hover{background:var(--g200);color:var(--ink)}
.cerrar:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.finL{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;position:relative;z-index:1;overflow:auto}
.oferta{
  width:100%;max-width:420px;margin:24px 0 14px;border-radius:14px;padding:20px 22px 18px;
  background:linear-gradient(140deg,#FFF6F4 0%,#FDEBE7 100%);
  border:0;text-align:center;
}
/* Variante cupón: fondo rojo y troquel */
.oferta.cupon{
  background:linear-gradient(152deg,#E4472F 0%,#DB3B2B 50%,#BE2B1C 100%);
  color:#fff;box-shadow:0 10px 28px -12px rgba(190,43,28,.6);position:relative;overflow:hidden;
}
.cup-top{display:flex;align-items:center;justify-content:center;gap:10px}
.cup-ico{display:grid;place-items:center;flex:0 0 auto}
.cup-ico svg{width:19px;height:19px}
.cup-lead{font-size:14px;font-weight:600;margin:0;color:rgba(255,255,255,.92)}
.cup-n{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 0}
.cup-n span{font-size:17px;font-weight:700;letter-spacing:0;margin-left:6px}
.cup-l{font-size:14px;margin:10px 0 0;line-height:1.4;color:rgba(255,255,255,.9)}
.cup-l b{font-weight:800;color:#fff}
/* Troquel: línea punteada y las dos muescas del cupón */
.corte{position:relative;height:0;margin:17px -22px;border-top:1px dashed rgba(255,255,255,.5)}
.corte::before,.corte::after{content:"";position:absolute;top:-11px;width:22px;height:22px;
  border-radius:50%;background:#fff}
.corte::before{left:-11px}
.corte::after{right:-11px}
.of-rot{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--red);margin:0;display:flex;align-items:center;gap:6px;justify-content:center}
.of-n{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;
  color:var(--ink);margin:12px 0 0}
.of-l{font-size:14px;font-weight:600;color:var(--ink);margin:2px 0 0}
.of-d{font-size:14px;color:var(--oxford);margin:10px 0 0;line-height:1.4}
.of-d b{color:var(--red);font-weight:800}
.cupon .of-cta{background:#fff;color:var(--red);margin-top:0}
.cupon .of-cta:hover{background:#FFF1EF}
.cupon .of-pie{color:rgba(255,255,255,.85)}
.of-cta{width:100%;margin-top:18px;background:var(--red);color:#fff;height:44px;border:0;
  border-radius:10px;font:700 14px 'Manrope',sans-serif;cursor:pointer;
  transition:background-color .15s ease}
.of-cta:hover{background:var(--red-hover)}
.of-cta:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.of-pie{font-size:11.5px;font-weight:600;color:var(--oxford);margin:12px 0 0;
  display:flex;align-items:center;justify-content:center;gap:6px}
/* Variante sin oferta: misma tarjeta, tono neutro */
.oferta.neutra{background:linear-gradient(140deg,#FBFBFB 0%,#F3F3F3 100%)}
/* Cierre de envíos: réplica del modal de cashback que ya corre en producción */
.modalFin.rojo{background:radial-gradient(50% 50% at 50% 50%,#DB3B2B 0%,#C42C1C 100%)}
.modalFin.rojo .cerrar{background:rgba(255,255,255,.16);color:#fff}
.modalFin.rojo .cerrar:hover{background:rgba(255,255,255,.3);color:#fff}
.rojoC{color:#fff}
.ofListo{font-size:16px;font-weight:700;letter-spacing:-.02em;margin:18px 0 0;
  color:rgba(255,255,255,.8)}
.ofTile{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;flex:0 0 auto;color:#fff}
.ofTile svg{width:28px;height:28px}
.rojoC h3.ofH{display:flex;flex-direction:column;align-items:center;gap:9px;
  margin:10px 0 0;font-size:inherit;font-weight:400;letter-spacing:0;color:#fff}
.ofLead{font-size:24px;font-weight:700;letter-spacing:-.02em}
.ofN{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1;
  display:inline-flex;align-items:baseline;gap:9px}
.ofN i{font-size:22px;font-weight:700;font-style:normal;letter-spacing:0}
.ofExtra{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ofPanel{width:100%;max-width:330px;margin:28px 0 0;border-radius:14px;
  background:rgba(255,255,255,.16);padding:17px 18px;flex:0 0 auto}
.ofPct{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1}
.ofPctL{font-size:13.5px;font-weight:500;margin:8px 0 0;line-height:1.35}
.ofCta{width:100%;max-width:330px;height:48px;margin:24px 0 0;border:0;border-radius:10px;
  background:#fff;color:var(--red);font:700 15px 'Manrope',sans-serif;cursor:pointer;
  flex:0 0 auto;transition:background-color .15s ease}
.ofCta:hover{background:#FFF1EF}
.ofCta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ofPie{font-size:12.5px;font-weight:600;margin:16px 0 0;display:flex;align-items:center;
  justify-content:center;gap:6px;color:rgba(255,255,255,.92)}
.ofCuerpo,.ofAcciones{display:flex;flex-direction:column;align-items:center;width:100%}
.ofAcciones{flex:0 0 auto}
.of-vis{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.of-pagos{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:16px}
.of-pago{line-height:0;display:inline-flex}
.of-pago svg{display:block;height:26px;width:auto}
/* Tienda: la línea encabeza, y abajo foto + acciones en dos bloques */
.oferta.tienda{text-align:left}
.of-row{display:flex;align-items:center;gap:16px;margin-top:14px}
.of-prod{height:130px;width:auto;display:block;flex:0 0 auto}
.of-btns.col{flex-direction:column;flex:1;min-width:0;margin-top:0;gap:10px}
.of-btns.col button{width:100%;flex:0 0 48px;height:48px}
.of-btns{display:flex;gap:10px;margin-top:18px}
.of-btns button{flex:1;min-width:0;height:44px;padding:0 10px;border-radius:10px;
  font:700 13px 'Manrope',sans-serif;white-space:nowrap;
  cursor:pointer;transition:background-color .15s ease, border-color .15s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.of-btns .b-sec{background:#fff;border:1px solid var(--g200);color:var(--ink)}
.of-btns .b-sec:hover{background:var(--g50)}
.of-btns .b-ia{background:#fff;border:1px solid #C9B8F7;color:#7C4DEF}
.of-btns .b-ia:hover{background:#F8F5FF}
.of-btns .b-pri{background:var(--red);border:0;color:#fff}
.of-btns .b-pri[aria-disabled="true"]{background:var(--red-200);cursor:not-allowed}
.of-btns .b-pri:hover{background:var(--red-hover)}
.of-btns button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* Mock del link de pago */

.linkSalida{background:none;border:0;color:var(--g500);font:500 13.5px 'Manrope',sans-serif;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px;border-radius:6px}
.linkSalida:hover{color:var(--ink)}
.linkSalida:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.plain{font-size:15px;color:var(--ink);margin:0 0 26px;max-width:44ch;line-height:1.6}
.plain b{font-weight:700}
.dbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.confetti{position:absolute;left:50%;top:50%;width:48%;height:80%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.modalFin .confetti{left:50%;width:88%;height:70%;top:32%}
.confetti svg{width:100%!important;height:100%!important;display:block}

@media (max-width:768px){
  .head{padding:22px 22px 0}
  .pane{padding:20px 22px 24px}
  .eyebrow{font-size:11px;margin-bottom:14px}
  .qb{min-height:70px}
  .q{font-size:20px;letter-spacing:-.022em}
  .help{font-size:13px}
  .opts,.opts.g3,.opts.g2{grid-template-columns:1fr;gap:12px}
  .opts.g2 > :last-child{grid-column:auto}
  .opts.g3 .opt-t{text-align:left}
  .opt{min-height:52px;padding:13px 14px}
  .field{font-size:16px}
  .rail{width:110px}
  .done{padding:26px 22px}
  .done h3{font-size:21px}
  /* El cierre conserva el mismo alto que las preguntas: la hoja no salta */
  .modalFin{width:100%;height:580px;max-height:100%}
  .finL{padding:26px 22px 22px}
  .of-n{font-size:26px}
  .of-btns button{font-size:12.5px;padding:0 8px}
  .ofN{font-size:44px}
  .ofN i{font-size:18px}
  .ofLead{font-size:20px}
  .ofExtra{font-size:15px}
  .ofPanel,.ofCta{max-width:none}
  /* En el sheet el botón y la vigencia quedan fijos al pie */
  .rojoC{justify-content:flex-start}
  .ofCuerpo{flex:1;min-height:0;justify-content:center}
  .ofAcciones{padding-top:24px}
  .ofListo{font-size:15px;margin-top:16px}
  .rojoC h3.ofH{margin-top:11px;gap:11px}
  .ofPanel{margin-top:30px}
  /* En angosto la foto cede ancho para que los botones respiren */
  .oferta{padding:18px}
  /* Ancho fijo por logo para que los seis queden en dos filas de tres */
  .of-pagos{max-width:141px;margin:0 auto 16px;gap:12px}
  .of-pago{width:37px;justify-content:center}
  .of-pago svg{max-width:100%;height:auto;max-height:24px}
  .of-row{flex-direction:column;gap:14px}
  .of-prod{height:120px}
  .of-btns.col{width:100%;flex:0 0 auto}
  .of-btns.col button{flex:0 0 46px;height:46px;padding:0 12px}
}

/* ══════════ Versión B · el primer paso real dentro del modal ══════════ */
.xhead{display:flex;align-items:center;gap:14px;padding:26px 44px 0;flex:0 0 auto}
.xhead h3{font-size:22px;font-weight:700;letter-spacing:-.028em;margin:0;flex:1;color:var(--ink)}
.xback{background:none;border:0;color:var(--ink);cursor:pointer;padding:4px;border-radius:6px;
  display:grid;place-items:center}
.xback:hover{color:var(--red)}
.xback:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.xayuda{font-size:14px;color:var(--g500);margin:0 0 20px;line-height:1.5}

/* Filas de método, tipo lista */
.fila{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;
  font-family:'Manrope',sans-serif;margin-bottom:10px;
  transition:background-color .15s ease, border-color .15s ease}
.fila:hover{background:var(--g50);border-color:var(--g200)}
.fila[aria-pressed="true"]{border-color:var(--red);background:var(--red-50)}
.fila[aria-pressed="true"] .mark{border-color:var(--red)}
.fila[aria-pressed="true"] .mark i{opacity:1}
.fila:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fila-c{flex:1;min-width:0}
.fila-logos{display:flex;gap:6px;margin-bottom:8px}
.fila-logos svg{height:20px;width:auto;display:block}
.fila-t{font-size:14px;font-weight:500;color:var(--ink)}
.fila svg.chev{color:var(--g400);flex:0 0 auto}

/* Montos con su etiqueta de cashback */
.montos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.monto{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 10px;
  cursor:pointer;font-family:'Manrope',sans-serif;text-align:center;
  transition:background-color .15s ease, border-color .15s ease}
.monto:hover{background:var(--g50)}
.monto[aria-pressed="true"]{border-color:var(--red);background:var(--red-50)}
.monto b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.monto span{display:inline-block;margin-top:7px;background:var(--g100);border-radius:5px;
  padding:3px 7px;font-size:10.5px;font-weight:600;color:var(--oxford)}
.monto[aria-pressed="true"] span{background:#fff;color:var(--red)}

/* Resumen de la recarga */
.resumen{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.res-f{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14px}
.res-f span:first-child{font-weight:600;color:var(--ink)}
.res-f span:last-child{color:var(--oxford);font-variant-numeric:tabular-nums}
.res-f.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.res-f.tot span{font-weight:700;color:var(--ink)}
.res-f.cb span:last-child{color:var(--red);font-weight:700}

.check-l{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--oxford);
  cursor:pointer;padding:6px 0;background:none;border:0;text-align:left;
  font-family:'Manrope',sans-serif}
.check-l .mark{flex:0 0 20px}
.check-l[aria-checked="true"] .mark{border-color:var(--red)}
.check-l[aria-checked="true"] .mark.check{background:var(--red)}
.check-l[aria-checked="true"] .mark i{opacity:1}
.check-l:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.check-l.centrado{width:fit-content;margin:4px auto 2px}

/* Aviso informativo */
.aviso{display:flex;gap:10px;background:#F0F8FF;border-radius:10px;padding:13px 15px;
  font-size:13px;color:#1A5FB4;line-height:1.45;margin-bottom:18px}
.aviso svg{flex:0 0 auto;margin-top:1px}

/* Datos con copiar */
.dato{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;
  font-size:14px;border-bottom:1px solid var(--line)}
.dato:last-of-type{border-bottom:0}
.dato .k{color:var(--oxford)}
.dato .v{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}

/* Formulario de tarjeta */
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campos .ancho{grid-column:1 / -1}
.campo-l{font-size:13px;font-weight:600;color:var(--ink);margin:12px 0 6px;grid-column:1 / -1}
.campo{height:44px;width:100%;border:1px solid var(--g200);border-radius:8px;background:#fff;
  padding:0 14px;font-family:'Manrope',sans-serif;font-size:14px;color:var(--ink)}
.campo::placeholder{color:var(--g400)}
.campo:focus{outline:none;border-color:var(--g400)}
.campo-logos{position:relative}
.campo-logos .logos{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  display:flex;gap:4px;pointer-events:none}
.campo-logos .logos svg{height:18px;width:auto;display:block}

/* Encabezado de SPEI y lista de puntos */
.spei-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}
.spei-h h4{font-size:16px;font-weight:700;margin:0;color:var(--ink)}
.spei-logo{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 8px;
  line-height:0;display:inline-flex}
.spei-logo svg{height:20px;width:auto;display:block}
.usado{display:block;font-style:normal;font-size:12px;color:var(--g500);font-weight:400}
.puntos{display:flex;flex-direction:column;gap:14px;margin-bottom:4px}
.punto{display:flex;gap:12px;font-size:14px;color:var(--oxford);line-height:1.45}
.pto{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;
  margin-top:1px}
.pto.ok{background:var(--green)}
.pto.av{border:1.5px solid var(--g400);color:var(--g500);font-weight:800;font-size:13px}
.check-l b{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* Pagos activado, dentro de la misma tarjeta */
.of-exito{text-align:center;margin-bottom:6px}
.of-exito p{margin:0;font-size:13.5px;color:var(--oxford);line-height:1.45}
.of-exito b{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}

/* Prompt de tienda */
.prompt{width:100%;min-height:120px;border:1px solid var(--g200);border-radius:10px;
  padding:14px 16px;font-family:'Manrope',sans-serif;font-size:15px;color:var(--ink);
  line-height:1.5;resize:none}
.prompt:focus{outline:none;border-color:var(--g400)}
.prompt-pie{font-size:12.5px;color:var(--g500);margin:10px 0 0}

@media (max-width:768px){
  .xhead{padding:22px 22px 0}
  .xhead h3{font-size:19px}
  .montos{grid-template-columns:1fr 1fr}
  .campos{grid-template-columns:1fr}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

            '</span><span class="tm">' + a[1] + '</span></div>'; }).join("") + '</div></div>' +
        '<div class="tbl"><div class="tr h">' + p.cols.map(function(c){
          return '<span>' + c + '</span>'; }).join("") + '</div>' +
          p.filas.map(function(f){
            var w = ["Pendiente","En tránsito","Recolectado"].indexOf(f[3]) !== -1;
            return '<div class="tr"><span style="font-weight:600;color:#1F2937">' + f[0] + '</span>' +
              '<span>' + f[1] + '</span><span>' + f[2] + '</span>' +
              '<span><span class="bdg' + (w ? " w" : "") + '">' + f[3] + '</span></span></div>';
          }).join("") + '</div>' +
      '</main></div>';
  }

  /* ── Render ────────────────────────────────────────────── */
  function render(){
    document.getElementById("app").innerHTML = admin();
    if(anim){ anim.destroy(); anim = null; }
    var v = document.getElementById("veil");
    v.className = "veil" + (entrada ? " enter" : "");
    v.innerHTML = modal();
    entrada = false;
    /* La celebración es de llegar al cierre. Dentro de él se repinta en cada
       clic —copiar, activar, elegir— y no hay nada nuevo que festejar. */
    var fin = v.querySelector(".finL");
    var llegando = !!fin && !enCierre;
    enCierre = !!fin;
    conectar(v);
    if(llegando){ fin.classList.add("celebra"); confeti(v); }
  }

  function confeti(root){
    var box = root.querySelector("#confetti");
    if(!box || !CONFETTI || typeof lottie === "undefined") return;
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    anim = lottie.loadAnimation({
      container: box, renderer: "svg", loop: false, autoplay: true,
      animationData: CONFETTI,
      rendererSettings: { preserveAspectRatio: "xMidYMid meet" }
    });
  }

  function conectar(root){
    root.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){ elegir(b); });
      b.addEventListener("keydown", function(e){
        if(e.key === " " || e.key === "Enter"){ e.preventDefault(); elegir(b); return; }
        if(b.getAttribute("role") !== "radio") return;
        if(["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"].indexOf(e.key) === -1) return;
        e.preventDefault();
        var l = Array.prototype.slice.call(root.querySelectorAll('.opt[role="radio"]'));
        var i = l.indexOf(b), d = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : -1;
        var s = l[(i + d + l.length) % l.length];
        s.focus(); elegir(s);
      });
    });

    var c = root.querySelector("#campo");
    if(c) c.addEventListener("input", function(){
      S.nombre = c.value; S.tocado = true; cta(root);
    });

    var n = root.querySelector("#next");
    if(n) n.addEventListener("click", avanzar);
    var a = root.querySelector("#atras");
    if(a) a.addEventListener("click", function(){ S.paso--; render(); foco(); });

    root.querySelectorAll("[data-fin]").forEach(function(b){
      b.addEventListener("click", function(){
        var principal = b.classList.contains("of-cta") || b.classList.contains("b-pri") ||
                        b.classList.contains("b-ia") || b.classList.contains("b-sec");
        if(b.getAttribute("aria-disabled") === "true") return;
        if(version === "B" && prod === "pagos" && !S.activado && principal){
          S.activado = true; entrada = false; render(); return;
        }
        if(version === "B" && principal && !S.extra && FLUJO[prod]){
          S.extra = FLUJO[prod]; entrada = false; render(); xfoco(); return;
        }
        S = inicial(); entrada = true; render();
      });
    });

    /* Controles de las pantallas de la versión B */
    root.querySelectorAll("[data-metodo]").forEach(function(b){
      b.addEventListener("click", function(){
        S.metodo = b.getAttribute("data-metodo");
        S.extra = S.metodo === "spei" ? "spei" : "monto";
        render(); xfoco();
      });
    });
    root.querySelectorAll("[data-monto]").forEach(function(b){
      b.addEventListener("click", function(){
        var v = b.getAttribute("data-monto");
        S.monto = v === "otro" ? null : parseInt(v, 10);
        render();
      });
    });
    root.querySelectorAll("[data-link]").forEach(function(b){
      b.addEventListener("click", function(){ S.tipoLink = b.getAttribute("data-link"); render(); });
    });
    root.querySelectorAll("[data-mp]").forEach(function(b){
      b.addEventListener("click", function(){
        b.setAttribute("aria-checked", b.getAttribute("aria-checked") === "true" ? "false" : "true");
      });
    });
    var fx = root.querySelector('[data-x="factura"]');
    if(fx) fx.addEventListener("click", function(){ S.factura = !S.factura; render(); });
    var tx = root.querySelector('[data-x="tyc"]');
    if(tx) tx.addEventListener("click", function(){ S.tyc = !S.tyc; render(); });

    root.querySelectorAll('[data-x="atras"]').forEach(function(b){
      b.addEventListener("click", xatras);
    });
    var sig = root.querySelector('[data-x="sig"]');
    if(sig) sig.addEventListener("click", xsiguiente);

    root.addEventListener("keydown", function(e){
      if(e.key !== "Tab") return;
      var f = root.querySelectorAll('button:not([tabindex="-1"]), input, [tabindex="0"]');
      if(!f.length) return;
      var p = f[0], u = f[f.length - 1];
      if(e.shiftKey && document.activeElement === p){ e.preventDefault(); u.focus(); }
      else if(!e.shiftKey && document.activeElement === u){ e.preventDefault(); p.focus(); }
    });
  }

  function cta(root){
    var n = root.querySelector("#next");
    if(!n) return;
    if(bloq()) n.setAttribute("aria-disabled","true"); else n.removeAttribute("aria-disabled");
  }

  function elegir(b){
    var g = b.getAttribute("data-g"), v = b.getAttribute("data-v");
    var raiz = b.closest(".veil");

    if(g === "tipo"){
      if(S.tipo === v) return;
      var ant = S.tipo;
      S.tipo = v;
      if(!S.tocado) S.nombre = PRELLENADO[v];
      if(ant === "vendiendo"){ S.canales = []; S.volumen = null; }
      raiz.querySelectorAll('.opt[data-g="tipo"]').forEach(function(o){
        var on = o.getAttribute("data-v") === v;
        o.setAttribute("aria-checked", on ? "true" : "false");
        o.setAttribute("tabindex", on ? "0" : "-1");
      });
      var ln = raiz.querySelector(".rail");
      if(ln) ln.outerHTML = linea();
      return;
    }
    if(g === "canales"){
      var i = S.canales.indexOf(v);
      if(i === -1) S.canales.push(v); else S.canales.splice(i, 1);
      b.setAttribute("aria-checked", S.canales.indexOf(v) !== -1 ? "true" : "false");
      cta(raiz);
      return;
    }
    if(g === "giro" || g === "volumen"){
      S[g] = v;
      b.parentElement.querySelectorAll(".opt").forEach(function(o){
        var on = o.getAttribute("data-v") === v;
        o.setAttribute("aria-checked", on ? "true" : "false");
        o.setAttribute("tabindex", on ? "0" : "-1");
      });
      cta(raiz);
      return;
    }
  }

  function xfoco(){
    var h = document.querySelector("#veil .xhead h3");
    if(h) h.focus({ preventScroll:true });
  }
  function xatras(){
    var e = S.extra;
    if(e === "monto") S.extra = "metodo";
    else if(e === "spei") S.extra = "metodo";
    else if(e === "tarjeta") S.extra = "monto";
    else { S = inicial(); entrada = true; }
    render(); xfoco();
  }
  function xsiguiente(){
    var e = S.extra;
    if(e === "tarjeta" || e === "spei") return;   /* fin del demo */
    if(e === "monto"){
      if(!S.monto) return;
      S.extra = S.metodo === "spei" ? "spei" : "tarjeta";
    }
    else { S = inicial(); entrada = true; }   /* fin del recorrido: vuelve a empezar */
    render(); xfoco();
  }

  function avanzar(){
    if(bloq()){
      var n = document.querySelector("#veil #next");
      if(n) n.focus();
      return;
    }
    S.paso++;
    render();
    foco();
  }

  function foco(){
    var campo = document.querySelector("#veil #campo");
    if(campo){
      campo.focus({ preventScroll:true });
      var n = campo.value.length;
      try { campo.setSelectionRange(n, n); } catch(err){}
      return;
    }
    var h = document.querySelector("#veil .q, #veil .done h3, #veil .finL h3");
    if(h) h.focus({ preventScroll:true });
  }

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.target.tagName === "INPUT"){ e.preventDefault(); avanzar(); return; }
    if(document.activeElement && document.activeElement.tagName === "BUTTON") return;
    e.preventDefault(); avanzar();
  });

  /* Selector de producto */
  var ab = document.getElementById("ab");
  ab.innerHTML = Object.keys(PROD).map(function(k){
    return '<button type="button" data-p="' + k + '" aria-pressed="' +
      (k === prod ? "true" : "false") + '">' + PROD[k].nombre + '</button>';
  }).join("");
  ab.querySelectorAll("[data-p]").forEach(function(b){
    b.addEventListener("click", function(){
      prod = b.getAttribute("data-p");
      ab.querySelectorAll("[data-p]").forEach(function(o){
        o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      S = inicial(); entrada = true; render();
    });
  });

  function ajustarTeclado(){
    var vv = window.visualViewport;
    if(!vv) return;
    var veil = document.getElementById("veil");
    veil.style.height = vv.height + "px";
    veil.style.top = vv.offsetTop + "px";
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", ajustarTeclado);
    window.visualViewport.addEventListener("scroll", ajustarTeclado);
    ajustarTeclado();
  }

  mqCel.addEventListener("change", function(){
    var ahora = mqCel.matches;
    if(ahora !== cel){ cel = ahora; render(); }
  });

  S = inicial();
  render();
})();
</script>
